# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
# =============================================================================
# AGENT 2 - HOSTED agent with a toolbox (2 free Microsoft MCP servers),
# PDF knowledge sources, custom site search, and persistent memory.
# Every default written out explicitly. Idle timeout deliberately cut to 300s
# so the class can watch scale-to-zero happen inside the session.
# =============================================================================
name: pwc-knowledge-agent

requiredVersions:
  azd: ">=1.27.1"
  extensions:
    azure.ai.agents: ">=1.0.0-beta.11"
    azure.ai.projects: ">=1.0.0-beta.4"

hooks:
  postprovision:
    shell: sh
    run: ./scripts/provision_memory_store.sh
    interactive: false
    continueOnError: false

services:

  ai-project:
    host: azure.ai.project
    endpoint: "${FOUNDRY_PROJECT_ENDPOINT}"
  # --- MCP connection 1: Microsoft Learn (public, free, NO AUTH) ----------
  # Verified: https://learn.microsoft.com/api/mcp requires no authentication and
  # is free to use. Tools: microsoft_docs_search, microsoft_docs_fetch,
  # microsoft_code_sample_search.
  learn-mcp:
    host: azure.ai.connection
    uses: [ai-project]
    category: RemoteTool
    target: https://learn.microsoft.com/api/mcp
    authType: Anonymous

  # --- MCP connection 2: Microsoft Learn, token-budgeted variant ---------
  # Same server, different endpoint config - demonstrates that connections are
  # per-endpoint, and shows the maxTokenBudget cost-control knob.
  learn-mcp-budget:
    host: azure.ai.connection
    uses: [ai-project]
    category: RemoteTool
    target: https://learn.microsoft.com/api/mcp?maxTokenBudget=2000
    authType: Anonymous

  # --- Toolbox: the bundle the agent actually gets -----------------------
  knowledge-tools:
    host: azure.ai.toolbox
    uses: [ai-project, learn-mcp, learn-mcp-budget]
    description: Microsoft Learn MCP, scoped web search, and PDF file search.
    tools:
      - type: mcp
        connection: learn-mcp
      - type: mcp
        connection: learn-mcp-budget
      # Custom site-scoped search: PwC public site.
      - type: web_search
        name: pwc_site_search
        description: Search the public PwC website.
        configuration:
          allowedDomains: ["pwc.com", "www.pwc.com"]
      # Custom site-scoped search: Microsoft Learn via ordinary web search, so
      # attendees can compare a *search* result against the *MCP* result.
      - type: web_search
        name: mslearn_site_search
        description: Search Microsoft Learn documentation by web search.
        configuration:
          allowedDomains: ["learn.microsoft.com"]
      # Grounding on the two PDFs in ../../knowledge
      - type: file_search
        name: workshop_pdfs
        description: The two workshop PDF handbooks.
        configuration:
          vectorStore: workshop-knowledge

  knowledge-agent:
    host: azure.ai.agent
    kind: hosted
    project: src
    language: docker
    uses: [ai-project, learn-mcp, learn-mcp-budget, knowledge-tools]
    toolboxes: [knowledge-tools]
    name: pwc-knowledge-agent
    description: Hosted agent grounded on PDFs, Learn MCP and scoped site search.
    protocols:
      - protocol: responses
        version: 2.0.0
    startupCommand: python main.py

    # ---- THE TEACHING KNOB -------------------------------------------------
    # Default is 900s. Min 300, max 3600. We set 300 so that during the lab the
    # session visibly scales to zero while you are still in the room, and the
    # next message demonstrably resumes with the filesystem intact.
    sessionConfiguration:
      idleTimeoutSeconds: 300

    container:
      resources:
        cpu: "0.5"                  # range "0.25" - "4.0"
        memory: 1.0Gi               # range 0.5Gi - 8.0Gi

    env:
      MICROSOFT_FOUNDRY_MODEL_DEPLOYMENT_NAME: "${WS_CHAT_MODEL}"
      EMBEDDING_DEPLOYMENT_NAME: "${WS_EMBEDDING_MODEL}"
      MEMORY_STORE_NAME: "${MEMORY_STORE_NAME}"
      APPLICATIONINSIGHTS_CONNECTION_STRING: "${APPLICATIONINSIGHTS_CONNECTION_STRING}"
      OTEL_SERVICE_NAME: pwc-knowledge-agent
      ENABLE_TRACING: "true"
      # NOTE: never declare FOUNDRY_PROJECT_ENDPOINT here. The platform injects it.
