# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
# =============================================================================
# AGENT 4 - Magentic harness "developer team" with swappable harness backend,
# per-session sandbox, git worktrees, and OBO (on-behalf-of) delegation so the
# agent acts as the SIGNED-IN ATTENDEE, not as a shared service identity.
# =============================================================================
name: pwc-dev-team-agent

requiredVersions:
  azd: ">=1.27.1"
  extensions:
    azure.ai.agents: ">=1.0.0-beta.11"
    azure.ai.projects: ">=1.0.0-beta.4"

services:

  ai-project:
    host: azure.ai.project
    endpoint: "${FOUNDRY_PROJECT_ENDPOINT}"
  learn-mcp:
    host: azure.ai.connection
    uses: [ai-project]
    category: RemoteTool
    target: https://learn.microsoft.com/api/mcp
    authType: Anonymous

  devteam-tools:
    host: azure.ai.toolbox
    uses: [ai-project, learn-mcp]
    description: Docs lookup for the dev team, with OBO user context.
    # OBO: the toolbox forwards the signed-in user's identity to the tool call
    # instead of the agent's own identity. Downstream services then see the
    # attendee, and their own RBAC applies.
    # VERIFY the exact field name against your extension version before the day.
    authMode: onBehalfOf
    tools:
      - type: mcp
        connection: learn-mcp

  devteam-agent:
    host: azure.ai.agent
    kind: hosted
    project: src
    language: docker
    uses: [ai-project, learn-mcp, devteam-tools]
    toolboxes: [devteam-tools]
    name: pwc-dev-team-agent
    description: Magentic-orchestrated developer team working in a git worktree.
    protocols:
      - protocol: responses
        version: 2.0.0
    startupCommand: python main.py

    # Coding work is bursty with long think-time. 1800s is the documented
    # recommendation for interactive coding assistants; we use it here so the
    # class can compare it against the 300s on agents 2 and 3.
    sessionConfiguration:
      idleTimeoutSeconds: 1800

    container:
      resources:
        cpu: "2.0"                   # sub-agents run in parallel
        memory: 4.0Gi

    env:
      MICROSOFT_FOUNDRY_MODEL_DEPLOYMENT_NAME: "${WS_CHAT_MODEL}"
      # THE SWAP SWITCH: "magentic" (default) or "github".
      HARNESS_BACKEND: "${HARNESS_BACKEND}"
      WORKTREE_ROOT: /home/agent/worktrees
      REPO_URL: "${DEVTEAM_REPO_URL}"
      APPLICATIONINSIGHTS_CONNECTION_STRING: "${APPLICATIONINSIGHTS_CONNECTION_STRING}"
      OTEL_SERVICE_NAME: pwc-dev-team-agent
      ENABLE_TRACING: "true"
